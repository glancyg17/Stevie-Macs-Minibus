<style>
  :root{
    --navy:#1F3864;
    --navy-deep:#152A4D;
    --navy-light:#4C6A9C;
    --paper:#F5F6F7;
    --white:#FFFFFF;
    --ink:#1A1C20;
    --soft:#5C6168;
    --line:#DCDFE2;
  }
  *{margin:0;padding:0;box-sizing:border-box;}
  body{
    background:var(--paper);color:var(--ink);font-family:'Poppins',sans-serif;
    min-height:100vh;display:flex;align-items:center;justify-content:center;

  .card{max-width:460px;}
  img{width:96px;height:96px;margin:0 auto 24px;display:block;}
  .code{
    font-family:'Playfair Display',serif;font-weight:800;font-size:1rem;
    color:var(--navy-deep);letter-spacing:0.1em;text-transform:uppercase;margin-bottom:10px;
  }
  h1{font-family:'Playfair Display',serif;font-size:2rem;margin-bottom:14px;color:var(--ink);}
  p{color:var(--soft);font-size:1rem;margin-bottom:30px;}
  .btns{display:flex;gap:12px;justify-content:center;flex-wrap:wrap;}
  .btn-primary{
    background:linear-gradient(180deg,var(--navy-light),var(--navy) 60%,var(--navy-deep));
    color:var(--white);padding:13px 24px;border-radius:4px;font-weight:700;font-size:0.92rem;
    border:1px solid var(--navy-deep);display:inline-block;
  }
  .btn-outline{
    border:1.5px solid var(--ink);color:var(--ink);padding:13px 24px;border-radius:4px;
    font-weight:600;font-size:0.92rem;display:inline-block;
  }
